[build-system]
requires = ["setuptools>=67.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OWL_DSL"
version = "0.2.2"
description = "Library for extracting Domain Specific Languages from OWL Ontologies (using owlready2)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "fuxi",
    "owlready2>=0.50",
    "pyyaml>=6.0.3",
    "rdflib>=7.5.0",
    "fast-diff-match-patch",
    "owlapy>=1.6.4",
]

[tool.poetry.dependencies]
my-package = { fuxi = "/home/chimezie/Projects/FuXi-reincarnate/FuXi-reincarnate-chimezie", develop = true }

authors = [
  { name = "Chimezie Ogbuji" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: PyPy",
]

[project.optional-dependencies]
nlp = [
    "spacy",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
"owl_dsl.review" = "owl_dsl.cli:main"
"owl_dsl.reason" = "owl_dsl.reasoner:main"
"owl_dsl.render_rules" = "owl_dsl.rule_cli:main"
